<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hujan — Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:    #111111;
      --muted:  #888888;
      --border: #e0e0e0;
      --accent: #444444;
      --white:  #ffffff;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'DM Sans', sans-serif;
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--white); color: var(--ink); font-family: var(--font-body); font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; }

    nav { padding: 1.4rem 4rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--white); z-index: 10; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: 0.78rem; letter-spacing: 0.08em; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }

    .coming-wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 4rem 2rem; text-align: center; gap: 1.2rem;
    }
    .coming-label { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .coming-title { font-family: var(--font-display); font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
    .coming-title span { color: var(--muted); }
    .coming-divider { width: 40px; height: 1px; background: var(--border); margin: 0.5rem auto; }
    .coming-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.8; max-width: 380px; }

    footer { padding: 1.8rem 4rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.06em; }

    @media (max-width: 700px) {
      nav, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <div class="coming-wrap">
    <p class="coming-label">Shop</p>
    <h1 class="coming-title">Coming <span>Soon</span></h1>
    <div class="coming-divider"></div>
    <p class="coming-desc">Something is being made with care. The shop will open soon — merchandise, prints, and more.</p>
  </div>

  <footer>
    <span>gtcsbgad gallery</span>
    <span>© 2026</span>
  </footer>
</body>
</html>
